name: Release

# Push a version tag (git tag v1.2.3 && git push --tags) to build every app
# and publish them together on the GitHub Releases page.
on:
  push:
    tags: ['v*']
  # Re-publish an existing version (for example after a failed run): Actions →
  # Release → Run workflow, and enter the tag. The apps are built from the
  # selected branch and attached to that tag's release.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to attach the files to, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  desktop:
    uses: ./.github/workflows/desktop.yml

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release
          merge-multiple: true

      # Artifacts keep their folder layout (nsis/, msi/, deb/…); flatten it
      # and drop spaces from the names so the download links stay readable.
      - name: Collect the files
        run: |
          mkdir -p out
          find release -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.msi' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0 |
            while IFS= read -r -d '' f; do
              mv "$f" "out/$(basename "$f" | tr ' ' '-')"
            done
          ls -la out
          test -n "$(ls out)"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: out/*
          generate_release_notes: true
